[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracevault"
version = "0.1.0"
description = "Traceable enterprise knowledge reasoning system for grounded RAG and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "TraceVault Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
keywords = ["rag", "knowledge-governance", "hybrid-retrieval", "grounded-ai", "traceability"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
tracevault = "tracevault.cli.main:main"

[project.urls]
Homepage = "https://github.com/xorcon/tracevault"
Documentation = "https://github.com/xorcon/tracevault/tree/main/docs"
Repository = "https://github.com/xorcon/tracevault"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
]
ignore = [
    "E501", # line too long (ruff formatter handles this)
]

[tool.ruff.isort]
known-first-party = ["tracevault"]
